<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Modern Login Form</title>
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600 flex justify-center items-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
        
        <h1 class="text-3xl font-bold text-center mb-2">
            Welcome Back
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Login to your account
        </p>

        <input
            type="email"
            placeholder="Email Address"
            class="w-full border border-gray-300 p-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

        <input
            type="password"
            placeholder="Password"
            class="w-full border border-gray-300 p-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

        <div class="flex justify-between items-center mb-4">
            <label class="flex items-center gap-2">
                <input type="checkbox">
                <span class="text-sm">Remember Me</span>
            </label>

            <a href="#" class="text-sm text-blue-500 hover:text-blue-700">
                Forgot Password?
            </a>
        </div>

        <button
            class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
            Login
        </button>

        <p class="text-center mt-5 text-gray-600">
            Don't have an account?
            <a href="#" class="text-blue-600 font-semibold hover:underline">
                Sign Up
            </a>
        </p>

    </div>

</body>
</html>
