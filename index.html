<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login Form</title>
</head>
<body class="bg-blue-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-80">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-600">
            Login
        </h1>

        <input
            type="email"
            placeholder="Enter Email"
            class="w-full border p-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

        <input
            type="password"
            placeholder="Enter Password"
            class="w-full border p-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

        <button
            class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-700">
            Sign In
        </button>

        <p class="text-center mt-4 text-gray-600">
            Don't have an account?
            <a href="#" class="text-blue-500 font-semibold">Register</a>
        </p>
    </div>

</body>
</html>
